name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Windows app folder
        run: pyinstaller orphanaut.spec --noconfirm

      - name: Copy Windows student guide beside executable
        run: copy WINDOWS-STUDENTS.txt dist\Orphanaut\WINDOWS-STUDENTS.txt
        shell: cmd

      - name: Create Windows zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Orphanaut -DestinationPath dist/Orphanaut-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: orphanaut-windows
          path: |
            dist/Orphanaut-Windows.zip
            dist/Orphanaut/Orphanaut.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build macOS app
        run: pyinstaller orphanaut.spec --noconfirm

      - name: Create macOS zip
        run: |
          cd dist
          zip -r Orphanaut-macOS.zip Orphanaut.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: orphanaut-macos
          path: dist/Orphanaut-macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: orphanaut-windows
          path: release

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: orphanaut-macos
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Orphanaut-Windows.zip
            release/Orphanaut-macOS.zip
          generate_release_notes: true
