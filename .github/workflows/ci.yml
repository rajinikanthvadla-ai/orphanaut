name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -v

      - name: App self-test
        run: python -m orphanaut --self-test

  # Build the packaged Mac app on both chips so packaging breaks show up before a release.
  package-macos:
    name: package (${{ matrix.arch }} Mac)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
            constraint: ""
          - runner: macos-15-intel
            arch: Intel
            constraint: "cryptography<49"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          echo "${{ matrix.constraint }}" > constraints.txt
          pip install -c constraints.txt --only-binary cryptography -e ".[dev]"
      - name: Build app
        run: pyinstaller orphanaut.spec --noconfirm
      - name: Self-test the packaged app
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen dist/Orphanaut.app/Contents/MacOS/Orphanaut --self-test > selftest.log 2>&1
          code=$?
          cat selftest.log
          if [ $code -ne 0 ]; then
            msg=$(tail -n 12 selftest.log | tr '\n' ' ' | cut -c1-900)
            echo "::error title=Packaged self-test failed on ${{ matrix.arch }}::$msg"
            exit $code
          fi
