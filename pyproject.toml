[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orphanaut"
version = "2.0.0"
description = "Cross-platform GUI to find and clean up billable AWS, Azure, and GCP resources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rajinikanth Vadla" }]
keywords = ["aws", "azure", "gcp", "cloud", "cleanup", "cost", "gui", "resources", "multi-cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "PySide6>=6.6",
    "azure-identity>=1.16",
    "azure-mgmt-compute>=30.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-resource>=23.0",
    "azure-mgmt-storage>=21.0",
    "google-api-python-client>=2.100",
    "google-auth>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
orphanaut = "orphanaut.main:main"

[project.urls]
Homepage = "https://github.com/rajinikanthvadla/orphanaut"
Repository = "https://github.com/rajinikanthvadla/orphanaut"
Issues = "https://github.com/rajinikanthvadla/orphanaut/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
