[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orphanaut"
version = "1.1.2"
description = "Cross-platform GUI to find and clean up billable AWS resources across all regions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rajinikanth Vadla" }]
keywords = ["aws", "cloud", "cleanup", "cost", "gui", "resources"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
orphanaut = "orphanaut.main:main"

[project.urls]
Homepage = "https://github.com/rajinikanthvadla/orphanaut"
Repository = "https://github.com/rajinikanthvadla/orphanaut"
Issues = "https://github.com/rajinikanthvadla/orphanaut/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
